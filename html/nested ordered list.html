<html>
	<head>
		<title>nested ordered list</title>
	</head>
	<body>
		<h1>nested ordered list</h1>
		<ol>
			<li>fruit</fruit>
			
				<ul>
					<li>apple</li>
					<li>mango</li>
					<li>kiwi</li>
					<li>banana</li>
					<li>orange</li>
			</ul>
			
			<li>vegatable</li>
				<ol>
					<li>potato</li>
					<li>onion</li>
					<li>tamato</li>
					<li>chilli</li>
					<li>pumpkin</li>
				</ol>
						
		</ol>
	</body>
</html>
